name = "neuron-api"
main = "src/index.ts"
compatibility_date = "2024-07-18"
compatibility_flags = ["nodejs_compat"]

# D1 stores user profiles, login challenges, rate limits, and authenticated sessions.
# Replace the database ID with your own Cloudflare resource before deploying.

[[d1_databases]]
binding = "DB" # i.e. available in your Worker on env.DB
database_name = "neuron-db"
migrations_dir = "src/database/migrations"
database_id = "fb89f6dd-b09a-4b16-b7e9-5fa7fc39cd6e"

