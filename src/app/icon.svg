<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="proxi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="dot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </radialGradient>
  </defs>

  <!-- Background squircle -->
  <rect width="32" height="32" rx="7.5" fill="url(#proxi-grad)"/>

  <!-- Radar beacon waves -->
  <!-- Outer arcs -->
  <path d="M 8.8 23.2 C 5.1 19.5 5.1 12.5 8.8 8.8" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" opacity="0.65"/>
  <path d="M 23.2 8.8 C 26.9 12.5 26.9 19.5 23.2 23.2" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" opacity="0.65"/>

  <!-- Mid arcs -->
  <path d="M 12.2 19.8 C 10.1 17.7 10.1 14.3 12.2 12.2" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.95"/>
  <path d="M 19.8 12.2 C 21.9 14.3 21.9 17.7 19.8 19.8" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.95"/>

  <!-- Center GPS geofence beacon dot -->
  <circle cx="16" cy="16" r="3" fill="url(#dot-glow)"/>
</svg>
